# Python tooling quality contract for the repository-maintenance scripts.
# The distributed VBA starter remains dependency-free; Ruff and mypy are CI/development tools only.

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90", "S314"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.10"
files = ["tools"]
pretty = true
show_error_codes = true
warn_unused_configs = true
