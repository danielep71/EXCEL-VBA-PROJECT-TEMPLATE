name: One-shot #81 second behavioral depth pass

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/v121-81-depth2.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Apply second behavioral depth payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/test_verification_depth.py")
          text = path.read_text(encoding="utf-8")
          imports = (
              "from email.message import Message\n"
              "import check_local_actions as local_actions\n"
              "import collect_portfolio_snapshot as snapshot\n"
              "import policy_coverage_runner as coverage_runner\n"
          )
          anchor = "import check_wiki as wiki\n"
          if imports not in text:
              if anchor not in text:
                  raise SystemExit("import anchor missing")
              text = text.replace(anchor, anchor + imports, 1)
          payload = Path(".github/v121-81-depth-payload.txt").read_text(encoding="utf-8")
          old_http = 'snapshot.urllib.error.HTTPError("u", 403, "no", {}, None)'
          new_http = 'snapshot.urllib.error.HTTPError("u", 403, "no", Message(), None)'
          if old_http not in payload:
              raise SystemExit("HTTP fixture typing anchor missing")
          payload = payload.replace(old_http, new_http, 1)
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in text:
              raise SystemExit("test footer missing")
          if "class WikiPublicationDepthTests" in text:
              raise SystemExit("second depth payload already applied")
          path.write_text(text.replace(marker, payload + marker, 1), encoding="utf-8", newline="\n")
          PY
          git rm .github/v121-81-depth-payload.txt

      - name: Validate second behavioral depth pass
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1" "PyYAML==6.0.3"
          ruff check tools/test_verification_depth.py --fix
          python3 tools/test_verification_depth.py -v
          python3 tools/initialize_repository.py --root . --self-test
          ruff check tools/test_verification_depth.py
          mypy tools/test_verification_depth.py
          git diff --check

      - name: Commit second behavioral depth pass
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add tools/test_verification_depth.py
          git commit -m "Cover remaining verification boundaries (#81)"
          git push origin HEAD:release/v1.2.1
