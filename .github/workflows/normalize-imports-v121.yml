name: Verify v1.2.1 Python quality ratchet
run-name: Verify Python ratchet — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - release/v1.2.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-v121-python-ratchet
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUFF_VERSION: "0.16.6"
      MYPY_VERSION: "2.3.1"
    steps:
      - name: Check out exact release-branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install pinned quality tools
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"

      - name: Verify import-order baseline
        run: ruff check tools

      - name: Verify incremental whole-tree mypy baseline
        run: mypy

      - name: Verify exact strict shared-gate boundary
        run: mypy --strict tools/_gatelib.py
