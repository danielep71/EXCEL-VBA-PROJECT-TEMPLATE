name: One-shot finalize Python verification depth

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/v121-finalize-81.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Update permanent #81 documentation and inventory
        run: |
          set -euo pipefail
          git rm --cached .github/workflows/v121-finalize-81.yml
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalogue_path = Path("docs/wiki/catalogue.json")
          data = json.loads(catalogue_path.read_text(encoding="utf-8"))
          data["files"]["tools/test_verification_depth.py"] = {
              "purpose": "Focused behavioral failure-path coverage for release, contract, Wiki, initializer and closeout tooling.",
              "kind": "script",
              "authority": "tools/README.md",
          }
          data["files"] = dict(sorted(data["files"].items()))
          catalogue_path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          readme_path = Path("tools/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = (
              "E501 is not selected and CI does not run `ruff format --check`; line length and\n"
              "formatter output are therefore not blocking rules. Prefer readable wrapping\n"
              "without changing literals or churning unrelated code. Editor indentation and\n"
              "line endings are defined in [`.editorconfig`](../.editorconfig).\n"
          )
          new = old + (
              "\n### Maintainer Python coverage\n\n"
              "The canonical reproducible coverage command is the complete `Exercise maintained Python\n"
              "tooling under coverage` shell block in\n"
              "[`.github/workflows/checker-development.yml`](../.github/workflows/checker-development.yml).\n"
              "It is intentionally CI-independent: after installing the pinned dependencies below, run\n"
              "that block verbatim from the repository root in Bash.\n\n"
              "```bash\n"
              "python -m pip install --disable-pip-version-check \"coverage[toml]==7.10.6\" \"PyYAML==6.0.3\"\n"
              "```\n\n"
              "The measurement scope is maintained `tools/*.py`. Test drivers matching\n"
              "`tools/test_*.py` are excluded from the denominator, while the maintained code they\n"
              "exercise remains measured. Coverage.py subprocess measurement is enabled so Python\n"
              "children launched by semantic fixtures are combined before reporting. The hosted and\n"
              "local contract uses a **95% statement-coverage floor** and emits both text and JSON\n"
              "evidence. Numeric coverage supplements the focused self-tests and policy-branch suites;\n"
              "it never replaces their behavioral or failure-semantics assertions.\n"
          )
          if "### Maintainer Python coverage" not in readme:
              if old not in readme:
                  raise SystemExit("tools README coverage anchor changed unexpectedly")
              readme = readme.replace(old, new, 1)
          readme_path.write_text(readme, encoding="utf-8", newline="\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          bullet = (
              "- Added reproducible maintainer Python coverage with subprocess measurement, a 95% "
              "statement floor, and focused behavioral failure-path fixtures for release, template-"
              "contract, Wiki, initializer, closeout, and reusable-workflow tooling.\n"
          )
          if bullet not in changelog:
              anchor = "### Changed\n\n"
              if anchor not in changelog:
                  raise SystemExit("CHANGELOG Changed anchor changed unexpectedly")
              changelog = changelog.replace(anchor, anchor + bullet, 1)
          changelog_path.write_text(changelog, encoding="utf-8", newline="\n")
          PY

          python3 tools/check_wiki.py --root . --write-reference
          git add CHANGELOG.md tools/README.md docs/wiki/catalogue.json docs/wiki/File-and-directory-reference.md

      - name: Validate permanent #81 documentation and inventory
        run: |
          set -euo pipefail
          python3 tools/check_wiki.py --root .
          python3 tools/check_documentation.py --root .
          python3 tools/check_repo.py --root .
          python3 tools/checker_development.py --root . --self-test
          git diff --check

      - name: Commit permanent finalization files
        run: |
          set -euo pipefail
          git reset HEAD -- .github/workflows/v121-finalize-81.yml
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git commit -m "Document and inventory Python verification depth (#81)"
          git push origin HEAD:release/v1.2.1
