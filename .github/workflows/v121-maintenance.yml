name: One-shot v1.2.1 maintenance

on:
  push:
    branches:
      - release/v1.2.1

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Apply mechanical integration updates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          # This workflow is deliberately one-shot; remove it from the resulting tree first.
          Path('.github/workflows/v121-maintenance.yml').unlink()

          checker = Path('tools/checker_development.py')
          text = checker.read_text(encoding='utf-8')

          closeout_exclusion = (
              '    "_release_closeout.py": (\n'
              '        "private post-release provider-snapshot validator with a dedicated self-test; "\n'
              '        "not a focused run_gate report CLI"\n'
              '    ),\n'
          )
          exclusion_anchor = 'GATE_RUNNER_EXCLUSIONS = {\n'
          if closeout_exclusion not in text:
              if exclusion_anchor not in text:
                  raise SystemExit('gate-runner exclusion anchor changed unexpectedly')
              text = text.replace(exclusion_anchor, exclusion_anchor + closeout_exclusion, 1)

          stale_reason = (
              'Provisioning utility with no dedicated offline suite; '
              'live consumer pilot evidence is separate'
          )
          current_reason = (
              'Offline cases: python tools/test_workflow_validation.py; '
              'live consumer pilot evidence is separate'
          )
          if stale_reason in text:
              text = text.replace(stale_reason, current_reason, 1)
          elif current_reason not in text:
              raise SystemExit('reusable-workflow fixture exclusion changed unexpectedly')
          checker.write_text(text, encoding='utf-8', newline='\n')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          marker = 'warn_redundant_casts = true\n'
          if marker not in text:
              raise SystemExit('mypy override marker changed unexpectedly')
          pyproject.write_text(text.replace(marker, '', 1), encoding='utf-8', newline='\n')

          closeout_helper = Path('tools/_release_closeout.py')
          text = closeout_helper.read_text(encoding='utf-8')
          old_names = (
              '    names = [\n'
              '        asset.get("name")\n'
              '        for asset in raw_assets\n'
              '        if isinstance(asset, dict) and isinstance(asset.get("name"), str)\n'
              '    ]\n'
          )
          new_names = (
              '    names: list[str] = []\n'
              '    for asset in raw_assets:\n'
              '        if not isinstance(asset, dict):\n'
              '            continue\n'
              '        name = asset.get("name")\n'
              '        if isinstance(name, str):\n'
              '            names.append(name)\n'
          )
          if old_names not in text:
              raise SystemExit('closeout asset-name block changed unexpectedly')
          closeout_helper.write_text(
              text.replace(old_names, new_names, 1),
              encoding='utf-8',
              newline='\n',
          )

          workflow = Path('.github/workflows/checker-development.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = '          run tools/check_template_contract.py --root . --self-test\n'
          closeout = '          run tools/_release_closeout.py --self-test\n'
          if closeout not in text:
              if anchor not in text:
                  raise SystemExit('coverage self-test anchor changed unexpectedly')
              text = text.replace(anchor, anchor + closeout, 1)

          step_start = text.find('      - name: Add coverage summary\n')
          step_end = text.find('      - name: Upload coverage evidence\n', step_start)
          if step_start < 0 or step_end < 0:
              raise SystemExit('coverage summary step boundaries changed unexpectedly')
          replacement = (
              '      - name: Add coverage summary\n'
              '        id: coverage-summary\n'
              '        if: always()\n'
              '        continue-on-error: true\n'
              '        run: |\n'
              '          {\n'
              '            echo "## Python statement coverage"\n'
              '            echo\n'
              '            echo "- Candidate: \\`$(git rev-parse HEAD)\\`"\n'
              '            echo "- Scope: maintained \\`tools/*.py\\`; '
              '\\`tools/test_*.py\\` excluded from the denominator."\n'
              '            echo "- Floor: **95% statement coverage**."\n'
              '            echo\n'
              '          } >> "$GITHUB_STEP_SUMMARY"\n'
              '          if [[ -f test-results/coverage-report.txt ]]; then\n'
              '            {\n'
              "              echo '```text'\n"
              '              cat test-results/coverage-report.txt\n'
              "              echo '```'\n"
              '            } >> "$GITHUB_STEP_SUMMARY"\n'
              '          else\n'
              '            echo "Coverage report was not produced." >> "$GITHUB_STEP_SUMMARY"\n'
              '            exit 1\n'
              '          fi\n\n'
          )
          text = text[:step_start] + replacement + text[step_end:]
          workflow.write_text(text, encoding='utf-8', newline='\n')

          catalogue_path = Path('docs/wiki/catalogue.json')
          catalogue = json.loads(catalogue_path.read_text(encoding='utf-8'))
          files = catalogue['files']
          files['.github/workflows/release-closeout.yml'] = {
              'purpose': 'Manual read-only capture and deterministic post-release closeout evidence.',
              'kind': 'workflow',
              'authority': 'docs/RELEASE_CLOSEOUT.md',
          }
          files['docs/RELEASE_CLOSEOUT.md'] = {
              'purpose': 'Canonical post-publication release closeout procedure and evidence boundaries.',
              'kind': 'document',
              'authority': 'docs/RELEASE_CLOSEOUT.md',
          }
          files['tools/_release_closeout.py'] = {
              'purpose': 'Private deterministic validator for retained post-release provider snapshots.',
              'kind': 'script',
              'authority': 'docs/RELEASE_CLOSEOUT.md',
          }
          catalogue_path.write_text(
              json.dumps(catalogue, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = (
              '- Added a read-only post-release closeout workflow that binds the annotated tag, '
              'tag-triggered CI, GitHub Release state, candidate-bound asset policy, comparison '
              'range, actual milestone membership, Wiki read-back, and provider-generated source '
              'archive observations to one certified SHA; uploaded assets remain distinct from '
              'GitHub source archives.\n'
          )
          if entry not in text:
              anchor = '## [Unreleased]\n\n### Changed\n\n'
              if anchor not in text:
                  raise SystemExit('Unreleased Changed anchor changed unexpectedly')
              text = text.replace(anchor, anchor + entry, 1)
              changelog.write_text(text, encoding='utf-8', newline='\n')
          PY

          # Stage the one-shot deletion so git ls-files presents the intended permanent tree.
          git add --all
          python3 tools/check_wiki.py --root . --write-reference

      - name: Validate mechanical result before commit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"
          ruff check tools/checker_development.py --fix
          ruff check tools
          mypy
          python3 tools/checker_development.py --root . --self-test
          python3 tools/_release_closeout.py --self-test
          python3 tools/check_wiki.py --root .
          python3 tools/check_repo.py --root .
          git diff --check

      - name: Commit integrated result and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add --all
          git commit -m "Integrate deterministic release closeout validation (#80)"
          git push origin HEAD:release/v1.2.1
