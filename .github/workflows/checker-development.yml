name: Checker development contract
run-name: Checker development — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checker-development-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checker-development:
    name: Checker development
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release head for guarded hardening
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply and validate guarded final hardening
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/1.1.0' && hashFiles('tools/_apply_final_hardening.py') != '' }}
        run: |
          set -euo pipefail
          python3 tools/_apply_final_hardening.py
          python3 tools/_patch_initializer_payload.py
          python3 tools/_patch_template_links.py
          python3 tools/_patch_xml_coverage.py
          git checkout HEAD -- .github/workflows/checker-development.yml
          git add --all
          python3 -m pip install --disable-pip-version-check 'ruff==0.16.6' 'mypy==2.3.1'
          ruff check tools
          mypy
          python3 tools/checker_development.py --root . --self-test
          python3 tools/check_release.py --root . --self-test
          python3 tools/check_release_semantics.py --root . --self-test
          python3 tools/initialize_repository.py --root . --self-test
          python3 tools/check_vba_conditionals.py --root . --self-test
          python3 tools/check_vba_public_api.py --root . --self-test
          python3 tools/check_policy_coverage.py --root . --self-test
          python3 tools/check_repo.py --root . --self-test
          python3 tools/check_repo.py --root .
          git diff --check
          git diff --cached --check
          git config user.name 'Daniele Penza'
          git config user.email '104122869+danielep71@users.noreply.github.com'
          git commit -m 'Harden XML and generated tool payload'
          git push origin HEAD:release/1.1.0

      - name: Exercise independent checker development contract
        id: self-test
        continue-on-error: true
        run: python3 tools/checker_development.py --root . --self-test

      - name: Publish checker development evidence
        id: evidence
        continue-on-error: true
        run: >-
          python3 tools/checker_development.py
          --root .
          --output test-results/checker-development.json
          --summary test-results/checker-development.md

      - name: Add readable summary
        id: summary
        if: always()
        continue-on-error: true
        run: |
          if [[ ! -f test-results/checker-development.md ]]; then
            echo "Required checker-development summary was not produced."
            exit 1
          fi
          cat test-results/checker-development.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checker-development evidence
        id: artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checker-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/checker-development.json
            test-results/checker-development.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce checker-development results
        if: always()
        env:
          SELF_TEST_OUTCOME: ${{ steps.self-test.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          failed=0
          for item in \
            "Checker-development self-test:$SELF_TEST_OUTCOME" \
            "Checker-development evidence:$EVIDENCE_OUTCOME" \
            "Job summary:$SUMMARY_OUTCOME" \
            "Evidence upload:$ARTIFACT_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name outcome: $outcome"
              failed=1
            fi
          done
          exit "$failed"
