name: OpenSSF Scorecard
run-name: Scorecard — ${{ github.ref_name }} @ ${{ github.sha }}

# Public supply-chain posture evidence for the canonical template. Publication
# runs only in trusted repository contexts; untrusted pull requests never receive
# write-capable credentials from this workflow.

on:
  branch_protection_rule:
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: "23 5 * * 4"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Supply-chain posture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Check out the exact SHA under analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Retain Scorecard SARIF evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish Scorecard result to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
