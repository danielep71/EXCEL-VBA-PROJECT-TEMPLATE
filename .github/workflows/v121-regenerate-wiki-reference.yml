name: One-shot regenerate #81 Wiki reference

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/v121-regenerate-wiki-reference.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Regenerate reference without retaining helper
        run: |
          set -euo pipefail
          git rm .github/workflows/v121-regenerate-wiki-reference.yml
          python3 tools/check_wiki.py --root . --write-reference
          python3 tools/check_wiki.py --root .
          git diff --check
          git add docs/wiki/File-and-directory-reference.md

      - name: Commit regenerated reference and helper deletion
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git commit -m "Regenerate Wiki inventory after #81 policy boundary"
          git push origin HEAD:release/v1.2.1
