name: One-shot apply #82 workflow policy refactor

on:
  push:
    branches:
      - fix/82-supply-chain-assurance
    paths:
      - .github/workflows/v121-82-complexity-refactor2.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out #82 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/82-supply-chain-assurance
          fetch-depth: 0

      - name: Apply and validate refactor
        run: |
          python tools/_tmp_refactor_82.py
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git rm tools/_tmp_refactor_82.py .github/workflows/v121-82-complexity-refactor2.yml
          git add tools/check_repo.py
          python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"
          ruff check tools
          mypy
          python tools/check_policy_coverage.py --root . --self-test
          python tools/check_repo.py --root . --self-test
          python tools/check_repo.py --root .
          git diff --check
          git commit -m "Refactor #82 workflow permission validation"
          git push origin HEAD:fix/82-supply-chain-assurance
