name: One-shot register verification-depth suite

on:
  push:
    branches:
      - release/v1.2.1

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Register non-workflow verification-depth changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          suite = Path('tools/test_verification_depth.py')
          suite_text = suite.read_text(encoding='utf-8')
          broken = '        self.assertFalse(closeout.check_wiki({}, {"mode": "generated"}, "a" * 40, [])["applicable"]\n'
          fixed = '        self.assertFalse(closeout.check_wiki({}, {"mode": "generated"}, "a" * 40, [])["applicable"])\n'
          if broken in suite_text:
              suite_text = suite_text.replace(broken, fixed, 1)
          elif fixed not in suite_text:
              raise SystemExit('verification-depth syntax repair anchor changed unexpectedly')
          suite.write_text(suite_text, encoding='utf-8', newline='\n')

          checker = Path('tools/checker_development.py')
          text = checker.read_text(encoding='utf-8')
          anchor = '    "test_release_provenance.py": "Unittest CLI; normal invocation runs its fixture suite",\n'
          entry = '    "test_verification_depth.py": "Unittest CLI; focused release-critical failure-path coverage",\n'
          if entry not in text:
              if anchor not in text:
                  raise SystemExit('checker exclusion anchor changed unexpectedly')
              text = text.replace(anchor, anchor + entry, 1)
          checker.write_text(text, encoding='utf-8', newline='\n')
          PY
          git add tools/test_verification_depth.py tools/checker_development.py

      - name: Validate suite and checker registry
        run: |
          set -euo pipefail
          python3 tools/test_verification_depth.py -v
          python3 tools/checker_development.py --root . --self-test
          git diff --check

      - name: Commit non-workflow changes
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git commit -m "Register release-critical verification-depth suite (#81)"
          git push origin HEAD:release/v1.2.1
