name: One-shot repair #81 placeholder fixture

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/v121-81-placeholder-repair.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Make placeholder fixture source-safe
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/test_verification_depth.py")
          text = path.read_text(encoding="utf-8")
          token = "{" + "{TOKEN}" + "}"
          old = f'(root / "token.txt").write_text("{token} TemplateIdentity\\n", encoding="utf-8")'
          new = 'placeholder = "{" + "{TOKEN}" + "}"\n            (root / "token.txt").write_text(f"{placeholder} TemplateIdentity\\n", encoding="utf-8")'
          if old not in text:
              raise SystemExit("placeholder fixture anchor is missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Validate repaired fixture
        run: |
          set -euo pipefail
          python3 tools/test_verification_depth.py -v
          python3 tools/initialize_repository.py --root . --self-test
          git diff --check

      - name: Commit fixture repair
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add tools/test_verification_depth.py
          git commit -m "Keep #81 placeholder fixture source-safe"
          git push origin HEAD:release/v1.2.1
