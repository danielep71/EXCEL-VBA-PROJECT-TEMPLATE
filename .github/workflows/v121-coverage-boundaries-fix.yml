name: One-shot fix remaining #81 coverage boundaries

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/v121-coverage-boundaries-fix.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Add typed deterministic remaining-boundary tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          source = Path('.github/workflows/v121-coverage-boundaries.yml').read_text(encoding='utf-8')
          match = re.search(r'^          payload = "([A-Za-z0-9+/=]+)"$', source, re.MULTILINE)
          if match is None:
              raise SystemExit('coverage-boundary payload not found')
          insertion = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          insertion = insertion.replace('        cases = [\n', '        cases: list[Any] = [\n')

          path = Path('tools/test_verification_depth.py')
          text = path.read_text(encoding='utf-8')
          if 'class RemainingCoverageDepthTests' in text:
              raise SystemExit('remaining coverage suite already present')
          text = text.replace('import json\n', 'import ast\nimport base64\nimport json\n', 1)
          text = text.replace(
              'import check_local_actions as local_actions\n',
              'import check_committed_whitespace as whitespace\n'
              'import check_local_actions as local_actions\n'
              'import checker_development as checker_dev\n',
              1,
          )
          anchor = '\n\nif __name__ == "__main__":\n'
          if anchor not in text:
              raise SystemExit('test-suite terminal anchor changed unexpectedly')
          text = text.replace(anchor, insertion + anchor, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Validate expanded behavioral suite
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"
          ruff check tools/test_verification_depth.py --fix
          ruff check tools/test_verification_depth.py
          mypy
          python3 tools/test_verification_depth.py -v
          git diff --check

      - name: Commit expanded suite
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add tools/test_verification_depth.py
          git commit -m "Cover remaining deterministic Python boundaries (#81)"
          git push origin HEAD:release/v1.2.1
