name: Static repository checks
run-name: Static checks — ${{ github.ref_name }} @ ${{ github.sha }}

# Canonical, dependency-free source-integrity gate. It complements, but never
# replaces, Excel compilation, regression, numerical-accuracy, UI-state,
# packaging, or exact-release certification.

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise all repository-initialization profiles
        id: initializer-self-test
        continue-on-error: true
        run: python3 tools/initialize_repository.py --root . --self-test

      - name: Exercise positive and degraded checker paths
        id: self-test
        continue-on-error: true
        run: python3 tools/check_repo.py --root . --self-test

      - name: Validate repository integrity
        id: gate
        continue-on-error: true
        run: >-
          python3 tools/check_repo.py
          --root .
          --output test-results/static-checks.json
          --summary test-results/static-checks.md

      - name: Publish readable job summary
        id: summary
        if: always()
        continue-on-error: true
        run: |
          if [[ -f test-results/static-checks.md ]]; then
            cat test-results/static-checks.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Static repository checks" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The checker did not produce its Markdown report." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload static-check evidence
        id: artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/static-checks.json
            test-results/static-checks.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce self-test and repository results
        if: always()
        env:
          INITIALIZER_SELF_TEST_OUTCOME: ${{ steps.initializer-self-test.outcome }}
          SELF_TEST_OUTCOME: ${{ steps.self-test.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          failed=0
          if [[ "$INITIALIZER_SELF_TEST_OUTCOME" != "success" ]]; then
            echo "::error::Initializer self-test outcome: $INITIALIZER_SELF_TEST_OUTCOME"
            failed=1
          fi
          if [[ "$SELF_TEST_OUTCOME" != "success" ]]; then
            echo "::error::Checker self-test outcome: $SELF_TEST_OUTCOME"
            failed=1
          fi
          if [[ "$GATE_OUTCOME" != "success" ]]; then
            echo "::error::Repository gate outcome: $GATE_OUTCOME"
            failed=1
          fi
          if [[ "$SUMMARY_OUTCOME" != "success" ]]; then
            echo "::error::Job-summary outcome: $SUMMARY_OUTCOME"
            failed=1
          fi
          if [[ "$ARTIFACT_OUTCOME" != "success" ]]; then
            echo "::error::Evidence-upload outcome: $ARTIFACT_OUTCOME"
            failed=1
          fi
          exit "$failed"
