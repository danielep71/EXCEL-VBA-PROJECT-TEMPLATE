name: Portfolio drift fixtures
on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install the hash-locked snapshot YAML parser
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r tools/requirements-portfolio-ci.txt
      - name: Exercise structural drift and failure boundaries
        run: python3 tools/test_portfolio_drift.py -v
      - name: Exercise timestamped quality reporting and evidence gaps
        run: python3 tools/test_portfolio_quality.py -v
      - name: Exercise simulated provisioning plans and guarded writes
        run: python3 tools/test_provision_repository.py -v
