name: Sync issue labels

# Pull requests validate without write permission. Only a trusted push to the
# default branch, or a manual dispatch from it, can reconcile the live
# repository taxonomy; a dispatch on any other branch validates and skips
# reconciliation, so an unmerged catalogue change never reaches live labels.
# The script validates and self-tests before the first API mutation, then
# verifies an exact post-run match.

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - .github/labels.json
      - .github/repository-profile.json
      - .github/scripts/labels-sync.mjs
      - .github/workflows/labels-sync.yml
  push:
    branches:
      - main
    paths:
      - .github/labels.json
      - .github/repository-profile.json
      - .github/scripts/labels-sync.mjs
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate label manifest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise validation, overlays, and reconciliation paths
        run: node .github/scripts/labels-sync.mjs --self-test

      - name: Validate the canonical manifest
        run: node .github/scripts/labels-sync.mjs --mode validate

  reconcile:
    name: Reconcile live labels
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the exact SHA to apply
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise validation, overlays, and reconciliation paths
        run: node .github/scripts/labels-sync.mjs --self-test

      - name: Reconcile and verify the versioned label selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/labels-sync.mjs --mode reconcile --repository "${GITHUB_REPOSITORY}"
