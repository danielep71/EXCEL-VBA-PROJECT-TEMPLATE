name: One-shot sort template-only paths

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/v121-sort-template-only-paths.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  sort:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Sort template-only paths case-insensitively
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/repository-profile.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          values = data['placeholders']['template_only_paths']
          ordered = sorted(values, key=str.casefold)
          if values == ordered:
              raise SystemExit('template_only_paths is already case-insensitively sorted')
          data['placeholders']['template_only_paths'] = ordered
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit deterministic ordering
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add .github/repository-profile.json
          git commit -m "Order template-only paths case-insensitively (#81)"
          git push origin HEAD:release/v1.2.1
