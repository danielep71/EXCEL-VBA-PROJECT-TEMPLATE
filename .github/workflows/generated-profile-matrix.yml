name: Generated profile CI matrix
run-name: Generated profiles — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-profile-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-profile:
    name: ${{ matrix.profile }} / preview=${{ matrix.preview }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile:
          - application
          - library
          - ui-component
        preview:
          - "present"
          - "absent"
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_VERSION: "3.10"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Check out the exact template candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned Python quality tools
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r tools/requirements-quality-ci.txt

      - name: Install pinned actionlint
        id: actionlint
        run: |
          validator_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${validator_dir}/actionlint.tar.gz"
          validator="${validator_dir}/actionlint"
          mkdir -p "$validator_dir"
          curl             --fail             --location             --proto '=https'             --retry 3             --retry-all-errors             --show-error             --silent             --tlsv1.2             --output "$archive"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive"             | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$validator_dir" actionlint
          "$validator" -version
          printf 'path=%s\n' "$validator" >> "$GITHUB_OUTPUT"

      - name: Create fresh generated repository
        env:
          PROFILE: ${{ matrix.profile }}
          PREVIEW: ${{ matrix.preview }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          fixture="${RUNNER_TEMP}/generated-${PROFILE}-${PREVIEW}"
          mkdir -p "$fixture"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          tar --exclude=.git --exclude=test-results -cf - . | tar -xf - -C "$fixture"
          git -C "$fixture" init -b main
          git -C "$fixture" config user.name "Generated Matrix"
          git -C "$fixture" config user.email "matrix@example.invalid"
          git -C "$fixture" add --all
          git -C "$fixture" commit -m "Create template fixture"

          args=(
            --root "$fixture"
            --profile "$PROFILE"
            --set "COPYRIGHT_YEAR=2026"
            --set "MAINTAINER_NAME=Generated Matrix"
            --set "PROJECT_NAME=Matrix ${PROFILE}"
            --set "PROJECT_TAGLINE=Generated CI fixture"
            --set "PROJECT_DESCRIPTION=Generated CI fixture for the ${PROFILE} repository profile."
            --set "REPOSITORY_PATH=example/matrix-${PROFILE}-${PREVIEW}"
            --set "SUPPORT_CONTACT=security@example.invalid"
            --add "KNOWN_LIMITATION=Excel execution is outside this static generated-profile matrix."
          )
          if [[ "$PREVIEW" == "present" ]]; then
            printf 'fixture-preview\n' > "$fixture/assets/social-preview.png"
            git -C "$fixture" add assets/social-preview.png
            git -C "$fixture" commit -m "Add selected preview fixture"
            args+=(--set "SOCIAL_PREVIEW_PATH=assets/social-preview.png")
          fi
          python3 "$fixture/tools/initialize_repository.py" "${args[@]}" --apply
          git -C "$fixture" add --all
          git -C "$fixture" commit -m "Initialize ${PROFILE} generated fixture"
          printf 'GENERATED_ROOT=%s\n' "$fixture" >> "$GITHUB_ENV"

      - name: Prove generated tree is self-contained
        run: |
          test ! -e "$GENERATED_ROOT/tools/create_reusable_workflow_fixture.py"
          test ! -e "$GENERATED_ROOT/tools/check_wiki.py"
          test ! -e "$GENERATED_ROOT/tools/checker_development.py"
          test ! -e "$GENERATED_ROOT/tools/collect_portfolio_snapshot.py"
          test ! -e "$GENERATED_ROOT/tools/policy_coverage_runner.py"
          test ! -e "$GENERATED_ROOT/tools/provision_repository.py"
          test ! -e "$GENERATED_ROOT/tools/test_template_workflow_validation.py"
          test ! -e "$GENERATED_ROOT/tools/test_template_verification_depth.py"

      - name: Inspect rendered pull-request template
        run: |
          cd "$GENERATED_ROOT"
          python3 - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path(".github/initialization.json").read_text(encoding="utf-8"))
          text = Path(".github/PULL_REQUEST_TEMPLATE.md").read_text(encoding="utf-8")
          expected_profile = {
              "application": "### application ·",
              "library": "### library ·",
              "ui-component": "### UI component ·",
          }[record["profile"]]
          expected_title = f"# 🔀 {record['values']['PROJECT_NAME']} Pull Request"
          required = (
              expected_title,
              expected_profile,
              "`python3 tools/check_repo.py --root .`",
              "`ProjectTests.RunProjectTests`",
              "[Unreleased]",
              "- [ ] Defect correction",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("generated PR template missing: " + ", ".join(missing))
          legacy = (
              "[PROJECT_NAME]",
              "[PROJECT PROFILE]",
              "[STATIC CHECK COMMAND]",
              "[AUTHORITATIVE PRODUCTION SOURCE MANIFEST OR LINK]",
              "[PUBLIC API OR USER SURFACE]",
              "[INTERNAL OR CORE ENGINE]",
              "[EXCEL HOST OR UI INTEGRATION]",
              "[TEST OR EVIDENCE SYSTEM]",
              "[COMPLETE REGRESSION OR CERTIFICATION ENTRY POINT]",
              "[OPTIONAL UI OR MANUAL SMOKE ENTRY POINT]",
              "[PROJECT-SPECIFIC HOST OR TOOL VERSION]",
          )
          retained = [item for item in legacy if item in text]
          if retained:
              raise SystemExit("generated PR template retained setup fields: " + ", ".join(retained))
          PY

      - name: Run retained generated-project tests
        env:
          ACTIONLINT_PATH: ${{ steps.actionlint.outputs.path }}
        run: |
          cd "$GENERATED_ROOT"
          python3 tools/test_documentation.py -v
          python3 tools/test_verification_depth.py -v
          python3 tools/test_workflow_validation.py             --root .             --actionlint "$ACTIONLINT_PATH"             --summary generated-workflow-validation.md

      - name: Run retained generated-project quality gates
        run: |
          cd "$GENERATED_ROOT"
          ruff check tools
          mypy
          python3 tools/check_documentation.py --root .
          python3 tools/check_template_contract.py --root .
          python3 tools/check_repo.py --root .

      - name: Record exact generated evidence
        env:
          PROFILE: ${{ matrix.profile }}
          PREVIEW: ${{ matrix.preview }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GENERATED_ROOT"])
          profile = json.loads((root / ".github/repository-profile.json").read_text(encoding="utf-8"))
          record = {
              "template_sha": os.environ["CANDIDATE_SHA"],
              "profile": os.environ["PROFILE"],
              "preview": os.environ["PREVIEW"],
              "generated_repository": profile["repository"],
              "scope": "static generated-project validation; no Excel execution",
          }
          Path("generated-matrix-evidence.json").write_text(
              json.dumps(record, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload matrix evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-${{ matrix.profile }}-${{ matrix.preview }}-${{ github.run_id }}
          path: |
            generated-matrix-evidence.json
            ${{ env.GENERATED_ROOT }}/generated-workflow-validation.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
