name: One-shot repair verification-depth suite

on:
  push:
    branches:
      - release/v1.2.1

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Repair focused suite quality contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/test_verification_depth.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "from pathlib import Path\nfrom unittest.mock import patch\n",
              "from pathlib import Path\nfrom typing import Any\nfrom unittest.mock import patch\n",
              1,
          )

          text = text.replace(
              "            for document in (\n",
              "            documents: tuple[dict[str, object], ...] = (\n",
              1,
          )
          text = text.replace(
              "            ):\n                config.write_text(json.dumps(document), encoding=\"utf-8\")\n",
              "            )\n            for document in documents:\n                config.write_text(json.dumps(document), encoding=\"utf-8\")\n",
              1,
          )

          token_literal = '"NAME=' + "{" * 2 + 'TOKEN' + "}" * 2 + '"'
          token_expression = '"NAME=" + "{" * 2 + "TOKEN" + "}" * 2'
          if token_literal not in text:
              raise SystemExit("placeholder test anchor changed unexpectedly")
          text = text.replace(token_literal, token_expression, 1)

          method = "    def test_replacement_badges_changelog_and_helpers(self) -> None:\n"
          index = text.index(method) + len(method)
          prefix, suffix = text[:index], text[index:]
          suffix = suffix.replace(
              "        catalogue = {\n",
              "        catalogue: dict[str, dict[str, Any]] = {\n",
              1,
          )
          text = prefix + suffix

          method = "    def test_already_initialized_and_placeholder_protection(self) -> None:\n"
          index = text.index(method) + len(method)
          prefix, suffix = text[:index], text[index:]
          suffix = suffix.replace(
              "            generated = {\n",
              "            generated: dict[str, Any] = {\n",
              1,
          )
          text = prefix + suffix

          repaired: list[str] = []
          for line in text.splitlines():
              if "variants.append(value)" in line and "; " in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  repaired.extend(indent + part for part in line.strip().split("; "))
              else:
                  repaired.append(line)
          text = "\n".join(repaired) + "\n"

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Validate repaired suite
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"
          ruff check tools/test_verification_depth.py
          mypy
          python3 tools/test_verification_depth.py -v
          python3 tools/checker_development.py --root . --self-test
          git diff --check

      - name: Commit repaired suite
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add tools/test_verification_depth.py
          git commit -m "Harden verification-depth test hygiene (#81)"
          git push origin HEAD:release/v1.2.1
