name: One-shot repair #81 final behavioral depth pass

on:
  push:
    branches:
      - release/v1.2.1
    paths:
      - .github/workflows/v121-81-final-depth-repair.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Apply repaired final behavioral fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          target = Path("tools/test_verification_depth.py")
          text = target.read_text(encoding="utf-8")

          old_imports = '''import _release_closeout as closeout
          import check_local_actions as local_actions
          import check_release as release
          import check_release_semantics as semantics
          import check_template_contract as contract
          import check_wiki as wiki
          import collect_portfolio_snapshot as snapshot
          import initialize_repository as initializer
          import policy_coverage_runner as coverage_runner
          '''
          new_imports = '''import _gatelib as gatelib
          import _release_closeout as closeout
          import check_committed_whitespace as whitespace
          import check_external_links as external_links
          import check_local_actions as local_actions
          import check_release as release
          import check_release_semantics as semantics
          import check_template_contract as contract
          import check_wiki as wiki
          import collect_portfolio_snapshot as snapshot
          import initialize_repository as initializer
          import policy_coverage_runner as coverage_runner
          import provision_repository as provision
          '''
          if old_imports not in text:
              raise SystemExit("import anchor missing")
          text = text.replace(old_imports, new_imports, 1)

          helper = Path(".github/workflows/v121-81-final-depth.yml").read_text(encoding="utf-8")
          start_marker = "          addition = r'''"
          end_marker = "\n          '''\n\n          text = text.replace(anchor, addition + anchor, 1)"
          start = helper.index(start_marker) + len(start_marker)
          end = helper.index(end_marker, start)
          addition = dedent(helper[start:end])
          old_cli = 'patch.object(external_links.sys, "argv", ["links", "--as-of", "2026-09-12"])'
          new_cli = 'patch("sys.argv", ["links", "--as-of", "2026-09-12"])'
          if old_cli not in addition:
              raise SystemExit("CLI repair anchor missing")
          addition = addition.replace(old_cli, new_cli, 1)

          anchor = '\n\nclass CloseoutCliDepthTests(unittest.TestCase):\n'
          if anchor not in text:
              raise SystemExit("class anchor missing")
          text = text.replace(anchor, addition + anchor, 1)
          target.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Validate repaired behavioral fixtures
        run: |
          set -euo pipefail
          python3 tools/test_verification_depth.py -v
          python3 tools/initialize_repository.py --root . --self-test
          python3 -m compileall -q tools/test_verification_depth.py
          git diff --check

      - name: Commit repaired depth fixtures
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add tools/test_verification_depth.py
          git commit -m "Expand #81 final behavioral coverage"
          git push origin HEAD:release/v1.2.1
