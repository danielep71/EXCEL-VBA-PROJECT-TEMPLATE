name: One-shot repair verification-depth marker literals

on:
  push:
    branches:
      - release/v1.2.1

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.2.1
          persist-credentials: true
          fetch-depth: 0

      - name: Remove executable marker literals from focused suite
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/test_verification_depth.py")
          text = path.read_text(encoding="utf-8")
          needle = "<!-- " + "template:"
          method = "    def test_render_blocks_behaviors_and_failures(self) -> None:\n"
          if needle not in text:
              raise SystemExit("marker-literal repair had nothing to change")
          if method not in text:
              raise SystemExit("render-block test anchor changed unexpectedly")
          text = text.replace(method, method + '        marker = "<!-- " + "template:"\n', 1)
          text = text.replace(needle, '" + marker + "')
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Validate repaired suite and initializer
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"
          ruff check tools/test_verification_depth.py
          mypy
          python3 tools/test_verification_depth.py -v
          python3 tools/initialize_repository.py --root . --self-test
          python3 tools/checker_development.py --root . --self-test
          git diff --check

      - name: Commit repaired suite
        run: |
          set -euo pipefail
          git config user.name "Daniele Penza"
          git config user.email "104122869+danielep71@users.noreply.github.com"
          git add tools/test_verification_depth.py
          git commit -m "Avoid executable template-marker literals in depth tests (#81)"
          git push origin HEAD:release/v1.2.1
