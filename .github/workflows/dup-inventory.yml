name: Temporary duplication inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'v1.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out milestone branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Inventory duplicated top-level helpers
        run: python3 tools/_dup_inventory.py
