name: Temporary review-batch migration v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'v1.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out milestone branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.1.0
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install pinned analyzers
        run: python -m pip install --disable-pip-version-check 'mypy==1.18.2' 'ruff==0.13.2'

      - name: Apply complete review-batch transformation
        run: |
          python tools/_patch_review_batch.py
          python tools/_apply_review_batch.py
          python tools/_post_review_batch_v3.py

      - name: Normalize the compressed API checker and remove import leftovers
        run: |
          ruff format tools/check_vba_public_api.py
          ruff check tools --fix \
            --exclude tools/_apply_review_batch.py \
            --exclude tools/_patch_review_batch.py \
            --exclude tools/_post_review_batch_v3.py
          ruff check tools \
            --exclude tools/_apply_review_batch.py \
            --exclude tools/_patch_review_batch.py \
            --exclude tools/_post_review_batch_v3.py

      - name: Require clean Python 3.10 typing
        run: |
          files=$(find tools -maxdepth 1 -name '*.py' \
            ! -name '_apply_review_batch.py' \
            ! -name '_patch_review_batch.py' \
            ! -name '_post_review_batch_v3.py' \
            -print | sort)
          python -m mypy $files
          python -m compileall -q tools

      - name: Exercise focused and canonical contracts
        run: |
          python tools/check_release.py --root . --self-test
          python tools/check_release_semantics.py --root . --self-test
          python tools/check_committed_whitespace.py --root . --self-test
          python tools/check_vba_jumps.py --root . --self-test
          python tools/check_vba_conditionals.py --root . --self-test
          python tools/check_vba_public_api.py --root . --self-test
          python tools/check_local_actions.py --root . --self-test
          python tools/checker_development.py --root . --self-test
          python tools/check_policy_coverage.py --root . --self-test
          python tools/initialize_repository.py --root . --self-test
          python tools/check_repo.py --root . --self-test
          python tools/check_repo.py --root .
          git diff --check

      - name: Commit validated hardening
        run: |
          git config user.name 'Repository review hardening'
          git config user.email 'repository-review@users.noreply.github.com'
          git add -A
          git reset \
            tools/_apply_review_batch.py \
            tools/_patch_review_batch.py \
            tools/_post_review_batch_v3.py \
            .github/workflows/review-batch-migration.yml \
            .github/workflows/review-batch-migration-v2.yml \
            .github/workflows/review-batch-migration-v3.yml
          if git diff --cached --quiet; then
            echo 'No permanent changes produced.'
            exit 1
          fi
          git commit -m 'Harden tooling, recovery, and generated-project boundaries'
          git push origin HEAD:v1.1.0
